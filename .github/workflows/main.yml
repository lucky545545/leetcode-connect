name: Sync LeetCode History

on:
  workflow_dispatch: # Allows you to trigger this manually
  schedule:
    - cron: '0 8 * * *' # Automatically runs every day at 8:00 AM

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Run LeetCode Sync
        uses: joshcai/leetcode-sync@v1.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'solutions'
          verbose: true
